[project]
name = "sorento-analytics-mcp"
version = "0.1.0"
description = "claude.ai custom connector: OAuth front door and read-only MCP tools for Sorento CRM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sorento-crm-mcp",
    "mcp>=1.2.0,<2",
    "httpx>=0.27.0",
    "starlette",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["sorento_analytics_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
