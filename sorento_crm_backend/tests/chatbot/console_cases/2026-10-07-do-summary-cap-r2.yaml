# Console case for DO-SUMMARY-CAP round 2 (owner hand test, 7 Oct 2026, turn e4895b28): the
# trailer under a capped By product group names the list the offer line names, with the same
# number. DO-only: `(reply 1 for the delivery order list)` above `Reply 1 for the delivery order
# list.`; both blocks: `(reply 1 for the sales order list)` / `(reply 2 for the delivery order
# list)` above the numbered offer, and `1` / `2` land on the sales order / delivery order list.
#
# `documentation/plans/chatbot/PLAN-do-summary-cap.md` ("R2: one target, one name"), UAC
# AC-1602 / AC-1603.
#
# NOT collected by pytest. Runs on the shared dev copy (sorento_cagent_stack) against a lane
# test copy, dry run, a dealer contact that holds `sales_orders.outstanding` and has no open
# question in its stored frames (the owner's own contact carried a stock ask from a later hand
# test, and "both" answered THAT; 445239408 is quiet since 18 Sep):
#
#   venv/bin/python scripts/chatbot_console_check.py \
#       tests/chatbot/console_cases/2026-10-07-do-summary-cap-r2.yaml --base-url http://127.0.0.1:8103 --live
#
# Case A is the owner's exact ask (HANLIM TRADING, September 2026: 40 products on 25 DOs, both
# HANLIM accounts picked). Cases B and C are SYNTALUN MARKETING (EM) SDN BHD (the first entry of
# the customer pick) over September 2026: 55 SO products and 38 DO products outstanding, so both
# blocks cap; B answers 1, C answers 2. The date range matters: an SO LIST with no period asks
# "Which period for ...?" first (`so_status.period_reply`, Q1 (a) of the SO-NUMBER-ASK lane), so a
# bare "1" on a both-scope offer without a range is a period question, not the list.
contact: "445239408"

cases:
  - name: R2-A DO-only (owner's case) - trailer and offer line name the same list, "1" lists every DO
    cold: true
    turns:
      - text: "HANLIM TRADING delivery order outstanding 01/09/2026 to 30/09/2026"
        expect:
          reply_contains: ["Which one do you mean?", "HANLIM TRADING"]
      - text: "both"
        expect:
          branch_kind: business_query
          reply_contains:
            - "*Delivery order outstanding*"
            - "*_By product_*"
            - "... and 20 more products (reply 1 for the delivery order list)"
            - "Reply 1 for the delivery order list."
          reply_not_contains: ["full list", "reply 2", "Sales order outstanding"]
          no_uuid: true
      - text: "1"
        expect:
          branch_kind: business_query
          reply_contains: ["DO Number:"]
          reply_not_contains: ["By product", "more products", "full list"]
          no_uuid: true

  - name: R2-B both blocks - SO trailer says reply 1 for the sales order list, DO trailer reply 2, "1" is the SO list
    cold: true
    turns:
      - text: "SYNTALUN MARKETING outstanding both 01/09/2026 to 30/09/2026"
        expect:
          reply_contains: ["Which customer do you mean?", "SYNTALUN MARKETING (EM) SDN BHD"]
      - text: "1"
        expect:
          branch_kind: business_query
          reply_contains:
            - "*Sales order outstanding*"
            - "(reply 1 for the sales order list)"
            - "*Delivery order outstanding*"
            - "(reply 2 for the delivery order list)"
            - "Reply with a number for detail:"
            - "1. Sales order list"
            - "2. Delivery order list"
            - "3. Both lists"
          reply_not_contains: ["full list", "(reply 2 for the sales order list)", "(reply 1 for the delivery order list)"]
          no_uuid: true
      - text: "1"
        expect:
          branch_kind: business_query
          reply_contains: ["SO Number:"]
          reply_not_contains: ["DO Number:", "By product", "more products", "full list"]
          no_uuid: true

  - name: R2-C both blocks - "2" is the DO list
    cold: true
    turns:
      - text: "SYNTALUN MARKETING outstanding both 01/09/2026 to 30/09/2026"
        expect:
          reply_contains: ["Which customer do you mean?", "SYNTALUN MARKETING (EM) SDN BHD"]
      - text: "1"
        expect:
          branch_kind: business_query
          reply_contains: ["(reply 1 for the sales order list)", "(reply 2 for the delivery order list)", "3. Both lists"]
          reply_not_contains: ["full list"]
      - text: "2"
        expect:
          branch_kind: business_query
          reply_contains: ["DO Number:"]
          reply_not_contains: ["SO Number:", "By product", "more products", "full list"]
          no_uuid: true
