# Console cases for ROGUE-CONVO-REVIEW PR-2 round R2 (PR #1506), 7 Oct 2026.
#
# The 14-row console table of the PR's crew-done comment, re-run on the R2 head with the
# REAL parser against a crew test copy of this branch on the prod-copy catalogue (the
# earlier run graded a scratch seed of fake codes in a cloud sandbox). Rows 13 and 14
# (image turns, class G) are posted to the turn endpoint by hand: the script sends text.
# Plan `documentation/plans/chatbot/PLAN-rogue-convo-review-06oct.md`, classes B, C, G.
#
# Values are the prod-copy catalogue's own: "8066" sits inside ~20 SRTWC8066-* codes
# (the which-one picker), "1097" inside exactly one (SRTWB1097), SRTSC07 exists and
# "Srts07" does not, SRTWC8354-SH (the code inside the pasted line) exists, so row 4 is
# graded on what BOTH acceptable forms share (the code is named, no set is listed).
#
# R2 adds the two unicode-dash shapes of turn 11 (en dash U+2013, minus sign U+2212):
# the fold that keys "did this message's own product token miss?" is now one fold on
# every side, so the reply quotes the dealer's token with its own character.
#
# EVERY CASE CARRIES A POSITIVE `reply_contains` (documentation/agents/chatbot-verification.md).
# The contact is an availability-only dealer with stored turns; override with --contact.
contact: "487555417"

cases:
  # ----------------------------------------------------------------- rows 1-3, class B1
  - name: row 1-3 - a bare number inside several codes picks, then asks the quantity, then answers
    cold: true
    turns:
      - text: "8066 stock ?"
        expect:
          reply_contains: ["8066 matches", "Which one?"]
          reply_not_contains: ["That would search every", "Couldn't find"]
          no_uuid: true
      - text: "2"
        expect:
          reply_contains: ["How many units of SRT"]
          no_uuid: true
      - text: "5"
        expect:
          reply_contains: [" x 5:"]
          reply_not_contains: ["Couldn't find", "Here's what you want"]
          no_uuid: true

  # ----------------------------------------------------------------- row 4, class C1
  # The grader compares case-insensitively, so the reader's DERIVED words are told apart
  # from the typed line by their ending: the derived miss ends `washdown toilet"`, the
  # typed line ends `SRTWC8354-SH"`.
  - name: row 4 - a pasted catalogue line never lists set members
    text: "SORENTO ONE PIECE WASHDOWN TOILET (S-TRAP250MM)-SRTWC8354-SH"
    cold: true
    expect:
      reply_contains: ["SRTWC8354-SH"]
      reply_not_contains: ["more)", "washdown toilet\"", "washdown toilet\n"]
      no_uuid: true

  # ----------------------------------------------------------------- row 5, class C1/C2
  - name: row 5 - price plus the pasted line never lists set members
    text: "price\nSORENTO ONE PIECE WASHDOWN TOILET (S-TRAP250MM)-SRTWC8354-SH"
    cold: true
    expect:
      reply_contains: ["SRTWC8354-SH"]
      reply_not_contains: ["more)", "washdown toilet\"", "washdown toilet\n"]
      no_uuid: true

  # ----------------------------------------------------------------- row 6, class B7 (+ R2)
  # On the prod-copy catalogue the availability lane's own miss line answers ("Couldn't
  # find Srt-hp. Ask again with the correct code."); on the scratch seed it was the #833
  # structure. Both quote the token AS TYPED; what is graded is that, and that no folded
  # or derived word ("srthp", "srt") stands in for it.
  - name: row 6 - a word-shaped product token is named as typed (hyphen)
    text: "Srt-hp"
    cold: true
    expect:
      reply_contains: ["Srt-hp"]
      reply_not_contains: ["\"srt\"", "srthp", "find srt.", "find srt ", "Here's what you want: srt\n"]
      no_uuid: true

  - name: row 6b (R2) - the same token typed with an en dash (Word)
    text: "Srt\u2013hp"
    cold: true
    expect:
      reply_contains: ["Srt\u2013hp"]
      reply_not_contains: ["\"srt\"", "srthp", "find srt.", "find srt ", "Here's what you want: srt\n"]
      no_uuid: true

  - name: row 6c (R2) - the same token typed with a minus sign (Excel)
    text: "Srt\u2212hp"
    cold: true
    expect:
      reply_contains: ["Srt\u2212hp"]
      reply_not_contains: ["\"srt\"", "srthp", "find srt.", "find srt ", "Here's what you want: srt\n"]
      no_uuid: true

  # ----------------------------------------------------------------- row 7, B4 control
  - name: row 7 - a near-miss spelling offers did-you-mean, then the real code answers
    cold: true
    turns:
      - text: "Srts07"
        expect:
          reply_contains: ["SRTSC07"]
          reply_not_contains: ["That would search every"]
          no_uuid: true
      - text: "SRTSC07"
        expect:
          reply_contains: ["SRTSC07"]
          reply_not_contains: ["Couldn't find"]
          no_uuid: true

  # ----------------------------------------------------------------- row 8, B4 control + B
  - name: row 8 - near-miss stock ask, the code, the count, the code with a count
    cold: true
    turns:
      - text: "Srts07 stock?"
        expect:
          reply_contains: ["SRTSC07"]
          reply_not_contains: ["That would search every"]
          no_uuid: true
      - text: "SRTSC07"
        expect:
          reply_contains: ["How many units of SRTSC07?"]
          no_uuid: true
      - text: "50"
        expect:
          reply_contains: ["SRTSC07 x 50:"]
          no_uuid: true
      - text: "Srtsc07 50 unit"
        expect:
          reply_contains: ["SRTSC07 x 50:"]
          reply_not_contains: ["Couldn't find", "\"unit\""]
          no_uuid: true

  # ----------------------------------------------------------------- row 9, class B1
  - name: row 9 - a bare number inside exactly one code is that code
    text: "1097 x 3"
    cold: true
    expect:
      reply_contains: ["SRTWB1097 x 3:"]
      reply_not_contains: ["Which one?", "That would search every", "Couldn't find"]
      no_uuid: true

  # ----------------------------------------------------------------- row 10, control
  - name: row 10 - a code with a count answers directly
    text: "SRTSC07 x 3 stock"
    cold: true
    expect:
      reply_contains: ["SRTSC07 x 3:"]
      reply_not_contains: ["Couldn't find"]
      no_uuid: true

  # ----------------------------------------------------------------- row 11, B4 control
  - name: row 11 - a bare stock ask still gets the scope sentence
    text: "stock?"
    cold: true
    expect:
      reply_contains: ["That would search every"]
      no_uuid: true

  # ----------------------------------------------------------------- row 12, #1502's shape
  # On the prod-copy catalogue SRTWC286 is a ten-code family, so the first turn is the
  # which-one picker and "4" is a PICK (the fourth code), not a count; the count comes
  # third. (On the scratch seed it was one code and "4" was the count.)
  - name: row 12 - a code family stock ask picks, asks the quantity, the count answers it
    cold: true
    turns:
      - text: "SRTWC286 stock"
        expect:
          reply_contains: ["SRTWC286", "Which one?"]
          reply_not_contains: ["That would search every", "Couldn't find"]
          no_uuid: true
      - text: "4"
        expect:
          reply_contains: ["How many units of SRTWC286-SH-NEW?"]
          no_uuid: true
      - text: "4"
        expect:
          reply_contains: ["SRTWC286-SH-NEW x 4:"]
          reply_not_contains: ["Couldn't find", "How many units"]
          no_uuid: true
