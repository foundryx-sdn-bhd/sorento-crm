      judge: "Clarify-loop cap (#1570, crew/state/reports/PV2-FROZEN-LANES-coverage-14oct.md; owner rule: the loop breaker is a hand-over offer): if T1 and T2 both asked the same which-product / which-set question, a third identical ask here FAILS; an answer or the loop breaker (refer-to-salesman line or hand-over offer) passes."

