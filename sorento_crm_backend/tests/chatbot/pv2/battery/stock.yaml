# PV2 battery: stock (on-hand) asks and their follow-ups. Contract: UAC-1 of
# documentation/plans/chatbot/pv2-eval-battery-14oct-acceptance-criteria.md.
# Quantities and warehouse figures drift on the dev DB: expectations name subjects, never numbers.
domain: stock
conversations:

- id: stock-r01
  source: real
  origin: "crew/state/handtest/PV2-FIX-r6-livecheck-20261014.tsv S10-11 T1-T2 and R6-S10-11a/b; PV2-FIX-r5-livecheck-20261014.tsv X-refine T2; laneboard/scripts/1653.md steps 4-5"
  domain: stock
  audience: staff
  shapes: [qty_carried, refine]
  turns:
  - text: "SRTWC286 stock"
    expect:
      kind: answer
      about: "stock for the whole SRTWC286 family (every variant), as the staff stock answer"
      must: ["SRTWC286"]
  - text: "5 unit"
    expect:
      kind: answer
      about: "the quantity 5 narrows the SRTWC286 stock ask just answered; for staff the stock answer again (or the same stock read for 5 units) is right; never a yes/no re-ask of an escalation offer"
      must: ["SRTWC286"]
      must_not: ["Sorry, I didn't catch your choice", "1. Yes"]
      allow_repeat: true
  - text: "only SRTWC286-SH-NEW"
    expect:
      kind: answer
      about: "stock narrowed to SRTWC286-SH-NEW (and its own sizes at most), not the whole family again"
      must: ["SRTWC286-SH-NEW"]

- id: stock-r02
  source: real
  origin: "crew/state/handtest/PV2-FIX-r6-livecheck-20261014.tsv T4-6 T1-T3 (dealer contact); PV2-FIX-r5-livecheck-20261014.tsv S16-17"
  domain: stock
  audience: dealer
  shapes: [qty_carried, number_pick, reply_to_question]
  turns:
  - text: "SRTWC286 stock"
    expect:
      kind: ask
      about: "an availability dealer typing the family code is asked which SRTWC286 variant, the options being the real variant codes"
      must: ["SRTWC286-SH"]
  - text: "5 unit"
    expect:
      kind: ask
      about: "the same which-variant question kept open with the quantity 5 carried (for example 'SRTWC286 x 5: which one?'), never the bare menu that drops the 5"
      must: ["SRTWC286"]
      must_any: [["x 5", "x5", "5 unit"]]
      must_not: ["Sorry, I didn't catch your choice"]
  - text: "1"
    expect:
      kind: answer
      about: "availability of the first option (SRTWC286-SH) for 5 units in the availability wording (Got stock / No stock with ETA), on-hand only"
      must: ["SRTWC286-SH"]

