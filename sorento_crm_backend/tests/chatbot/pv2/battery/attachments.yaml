      kind: answer
      about: "photos and technical drawings of the held SRTWC286 family sent directly for the members that have them (SRTWC286-SH has both); 'htis' is 'this', never a product"
      attachments: true
      must: ["SRTWC286-SH"]
      must_not: ['Couldn''t find: "this"', "has no Product Photos"]
