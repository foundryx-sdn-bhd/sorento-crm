    expect:
      kind: answer
      about: "deliveries for HANLIM TRADING on 07/10/2026: says none if none (may mention outstanding orders); group name only"
      must: ["HANLIM"]
  - text: "SRT391-GM几时会安排送货？"
    expect:
      kind: ask
      about: "carried customer + newly named product: asks whether the SRT391-GM delivery question is for HANLIM TRADING only or all customers, with nothing fetched"
      must: ["SRT391-GM"]
  - text: "十月"
    expect:
      kind: any
      about: "October as the period for the SRT391-GM delivery question (answers it, or asks the still-open scope once); never repeats the identical question and never invents dates"
      must: ["SRT391-GM"]

