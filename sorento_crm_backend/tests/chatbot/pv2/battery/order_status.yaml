# PV2 battery: SO / DO / PO status by number, and switching away and back (UAC-1).
# Dev data (14 Oct): DO 202610-0151 = J & Y WORLD HARDWARE SDN BHD [A/C IV], 1 line CKS1052-BL x2;
# SO422057 = HANLIM TRADING SDN BHD [A/C IV], 1 line CSH3010-BL-DIY x2 (photo on file);
# SO420420 = HANLIM TRADING SDN BHD [A/C I], products SRTWT910-BL, SRTWT6232-GM, SRTWT1908-BL-DIY;
# PO 202208-S0069 holds SRT373-8; PO 202606-S0105 holds SRTWC286-SH-NEW among others.
domain: order_status
conversations:

- id: order-r01
  source: real
  origin: "laneboard/scripts/1653.md steps 1-3 and 1657.md steps 8-10; crew/state/handtest/PV2-FIX-r6-livecheck-20261014.tsv S6-8 T1-T3; PV2-FIX-r8a-livecheck-20261014.tsv C-S8-10"
  domain: order_status
  audience: staff
  shapes: [topic_switch, switch_back]
  turns:
  - text: "202610-0151 STATUS?"
    expect:
      kind: answer
      about: "order 202610-0151 of J & Y WORLD HARDWARE SDN BHD with its status and line"
      must: ["202610-0151"]
  - text: "SRTWC286 stock"
    expect:
      kind: answer
      about: "a new topic: the full stock answer for the SRTWC286 family; the order is not mixed in"
      must: ["SRTWC286"]
      must_not: ["202610-0151"]
  - text: "back to the order just now, which warehouse?"
    expect:
      kind: answer
      about: "switch back to order 202610-0151 and answer its warehouse; if an offer is re-asked instead it names the warehouse team, never purchasing"
      must: ["202610-0151"]
      must_not: ['Which "which warehouse"', 'Which "the order just now"', "purchasing team", "Sorry, I didn't catch your choice"]

- id: order-r02
  source: real
  origin: "crew/state/handtest/PV2-FIX-r5-livecheck-20261014.tsv S4 T1 (T2 added); PV2-FIX-r7-livecheck-20261014.tsv JD-S4"
  domain: order_status
  audience: staff
  shapes: [language_mix, particle, small_talk]
  turns:
  - text: "boss PS202609-0469 sudah hantar ka? 几时到?"
    expect:
      kind: answer
      about: "order PS202609-0469 of HONG BEE HARDWARE COMPANY SDN BHD (PROJECT): not delivered yet with its current status; a mixed Malay / Chinese / English reply is fine"
      must: ["PS202609-0469"]
  - text: "ok thanks boss"
    expect:
      kind: answer
      about: "a short thank-you acknowledgement; no lookup, no repeat of the order card, no hand-over"
      must_not: ["Routed to your PIC", "Couldn't find"]

- id: order-r03
  source: real
  origin: "crew/state/handtest/PV2-FIX-r5-livecheck-20261014.tsv F-po T1 (T2-T3 added); crew/state/eval/dev/cand-0291.json"
  domain: order_status
  audience: staff
  shapes: [refine, topic_switch]
  turns:
  - text: "SRT373-8 got po?"
    expect:
      kind: answer
      about: "the outstanding PO for SRT373-8 (PO 202208-S0069)"
      must: ["SRT373-8", "202208-S0069"]
  - text: "supplier?"
    expect:
      kind: answer
      about: "the supplier of that PO for SRT373-8 (staff hold the supplier field)"
      must_not: ["Couldn't find", 'Which "supplier"']
  - text: "PO 202606-S0105 status?"
    expect:
      kind: answer
      about: "status and lines of PO 202606-S0105"
      must: ["202606-S0105"]

- id: order-r04
  source: real
  origin: "crew/state/handtest/PV2-FIX-r8a-livecheck-20261014.tsv B-AL-F-osb T1-T3; PV2-FIX-r7-livecheck-20261014.tsv AL-F-osb"
  domain: order_status
  audience: dealer_nogrant
  shapes: [permission, topic_switch, switch_back]
  turns:
  - text: "SO422057 status?"
    expect:
      kind: refuse
      about: "no sales-order grant: the refusal line, before any lookup, so it never shows whether the order exists"
      must: ["Sales order figures are not enabled for your account."]
      must_not: ["Couldn't find", "escalate"]
  - text: "SRTXYZ999 stock"
    expect:
      kind: any
      about: "SRTXYZ999 is not a product: a not-found line, optionally with an offer to the warehouse team"
      must: ["SRTXYZ999"]
  - text: "back to the order just now, which warehouse?"
    expect:
      kind: refuse
      about: "switching back to SO422057 is still refused with the same sales-order refusal; never re-asks the SRTXYZ999 offer"
      must: ["Sales order figures are not enabled for your account."]
      must_not: ["Sorry, I didn't catch your choice", "SRTXYZ999"]

- id: order-r05
  source: real
  origin: "crew/state/handtest/PV2-FIX-r5-livecheck-20261014.tsv P-otherDO-jen T1 and S23 T1 (T2 added)"
  domain: order_status
  audience: unlinked
  shapes: [yes_no, reply_to_question]
  turns:
  - text: "Delivery 202609-2012"
    expect:
      kind: any
      about: "a delivery order that is not this contact's: a not-found line with an offer to the customer service team (no order details shown)"
      must: ["202609-2012"]
      must_not: ["DELUXE HOME CENTRE"]
  - text: "yes"
    expect:
      kind: any
      about: "accepts the offer: hands over to customer service (or asks which person when a picker is shown); never blank"
      must_not: ["Sorry, I didn't catch your choice"]

