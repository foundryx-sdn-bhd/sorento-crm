- id: order-r08
  source: real
  origin: "crew/state/eval/dev/cand-0230.json (history + message); crew/state/reports/PV2-FROZEN-LANES-coverage-14oct.md #1570 (a)"
  domain: order_status
  audience: dealer
  shapes: [mixed_types, language_mix, free_text_reply, reply_to_question]
  turns:
  - text: "estimate delivery time ?"
    expect:
      kind: ask
      about: "nothing named: asks which order or product the delivery estimate is for"
  - text: "Delivery order list"
    expect:
      kind: any
      about: "the dealer's own delivery orders, or a question for the period; never another customer's orders"
