    expect:
      kind: answer
      about: "ETA / incoming for SRTWC286-SH-NEW"
      must: ["SRTWC286-SH-NEW"]
  - text: "ok send me photo of SRTWC286-SH"
    expect:
      kind: answer
      about: "the photo of SRTWC286-SH is sent"
      attachments: true
      must: ["SRTWC286-SH"]
      must_not: ["SRTWC286-SH has no Product Photos"]

- id: mixed-r04
  source: real
  origin: "crew/state/reports/PV2-FROZEN-LANES-coverage-14oct.md #1517 ROGUE (dealer typed 'product'; T2-T3 added)"
  domain: mixed
  audience: dealer
  shapes: [unclear, free_text_reply, refine]
  turns:
  - text: "product"
    expect:
      kind: ask
      about: "a bare 'product': asks which product (or what about it); no tool call, never a 50-row dump, never inactive rows"
      must_not: ["FOR ACCOUNT DEPARTMENT ONLY"]
  - text: "SRTKS7061"
    expect:
      kind: any
      about: "SRTKS7061 named: its availability, or a short question what is needed (stock, ETA, files, promotion)"
      must: ["SRTKS7061"]
  - text: "got stock?"
    expect:
      kind: answer
      about: "availability of SRTKS7061"
      must: ["SRTKS7061"]

- id: mixed-r05
  source: real
  origin: "crew/state/eval/dev/cand-0286.json (history + message)"
  domain: mixed
  audience: unlinked
  shapes: [permission, typo, free_text_reply]
  turns:
  - text: "what cost srtkt72ss-new"
    expect:
      kind: any
      about: "purchase cost is not given to this contact: refuses the cost (SRTKT72SS-NEW may also be a did-you-mean for SRTKT72SS); never a cost figure"
      must_not: ["CNY", "MYR"]
      judge: "No money amount may appear (RM, CNY or MYR figures)."
  - text: "SRTKT72SS"
    expect:
      kind: any
      about: "the product picked; purchase cost still refused, other allowed facts (availability) fine; never a cost figure"
      must_not: ["CNY", "MYR"]
  - text: "why?"
    expect:
      kind: answer
      about: "explains briefly that purchase cost is restricted for this account and the salesman can help; no topic menu"
      must_not: ["CNY", "MYR", "Couldn't find"]

- id: mixed-i01
  source: improvised
  domain: mixed
  audience: staff
  shapes: [topic_switch, switch_back, qty_carried, small_talk]
  turns:
  - text: "SRTKS6042-BL stock"
    expect:
      kind: answer
      about: "stock for SRTKS6042-BL"
      must: ["SRTKS6042-BL"]
  - text: "promo?"
    expect:
      kind: any
      about: "promotions for the held SRTKS6042-BL: which copy, or sends them"
      must_not: ["Couldn't find"]
  - text: "send dealer copy"
    expect:
      kind: answer
      about: "the dealer copy of the SRTKS6042-BL promotion is sent"
      attachments: true
  - text: "back to the stock, got 10?"
    expect:
      kind: answer
      about: "switch back to SRTKS6042-BL stock: the numbers table answers whether 10 are on hand (staff); a 'Carrying on from <real date>' recap line is fine; no flyer re-sent (owner ruling 15 Oct)"
      must: ["SRTKS6042-BL"]
      attachments: false
  - text: "thanks"
    expect:
      kind: answer
      about: "a short acknowledgement"
      judge: "The staff contact's stored first name is the honorific 'Mr'; addressing the contact as 'Mr' is its own stored name, not a broken placeholder."

