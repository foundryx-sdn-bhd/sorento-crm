# PV2 battery: conversations that cross domains on purpose (UAC-1).
domain: mixed
conversations:

- id: mixed-r01
  source: real
  origin: "crew/state/handtest/PV2-FIX-r6-livecheck-20261014.tsv X-switch T1-T3; laneboard/scripts/1657.md step 16 (sources digest r8-11)"
  domain: mixed
  audience: dealer
  shapes: [topic_switch, switch_back, qty_carried]
  turns:
  - text: "SRTWC286-SH stock 3 unit"
    expect:
      kind: answer
      about: "availability of SRTWC286-SH for 3 units"
      must: ["SRTWC286-SH"]
  - text: "sales report for September delivered"
    expect:
      kind: any
      about: "a topic switch: the dealer's own delivered sales for September 2026, or one question about it"
      judge: "Report figures come from the PV2 report route, which records no lookup event in the trace; do not fail on figures that are absent from the facts. Header customer names are customer GROUP names (on dev MODERNMED SDN BHD sits in group 1 LIVING DEPOT SDN BHD); a by-customer drill lists accounts."
  - text: "ok back to the SRTWC286-SH, got 10 unit?"
    expect:
      kind: answer
      about: "switch back with the typed product: availability of SRTWC286-SH for 10 units"
      must: ["SRTWC286-SH"]
      must_not: ["I need at least one filter"]

- id: mixed-r02
  source: real
  origin: "laneboard/scripts/1653.md step 6; crew/state/handtest/PV2-FIX-r6-livecheck-20261014.tsv X-zh-order4 and R6-zh-order4a/b (T2 added)"
  domain: mixed
  audience: dealer
  shapes: [multi_product, language_mix, qty_carried]
  turns:
  - text: "老板，我要订货：SRTWC286-SH 5个，SRTWF12C-GM-NEW 3个，SRT373-8 2个，SRTWB999 4个"
    expect:
      kind: any
      about: "an order request for four products with quantities: the purchase-request portal link (or the old bot's own reading), Chinese reply; only the typed codes, never squashed or widened codes"
      lang: zh
      must_not: ["Could not find portal link", "SRTWF12CGMNEW", "SRT3738", "SRTWC286-SH-NEW-150"]
  - text: "SRTWB999 几时有货？"
    expect:
      kind: answer
      about: "availability / next ETA for SRTWB999, Chinese reply"
      must: ["SRTWB999"]
      lang: zh

- id: mixed-r03
  source: real
  origin: "crew/state/handtest/PV2-FIX-r5-livecheck-20261014.tsv S22 T1 (sources digest R1; T2-T3 added)"
  domain: mixed
  audience: unlinked
  shapes: [topic_switch, refine]
  turns:
  - text: "any PO for SRTWC286?"
    expect:
      kind: answer
      about: "the placed POs for SRTWC286 products, with supplier and cost stripped for a non-staff contact"
      must: ["SRTWC286"]
      must_not: ["Supplier:", "Unit Cost", "Cost:"]
