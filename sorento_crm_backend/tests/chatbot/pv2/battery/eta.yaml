# PV2 battery: ETA / incoming asks and their follow-ups (UAC-1).
# ETA dates and incoming quantities drift: expectations name the products, never dates or numbers.
domain: eta
conversations:

- id: eta-r01
  source: real
  origin: "crew/state/handtest/PV2-owner-loo-r7-20261014.tsv T1-T5; PV2-FIX-r8a-livecheck-20261014.tsv A-OWNLOO-LOO T1-T5 and C-S3-5"
  domain: eta
  audience: staff
  shapes: [particle, reply_to_question, number_pick, refine, language_mix, typo]
  turns:
  - text: "check stock srtwc286"
    expect:
      kind: answer
      about: "stock for the SRTWC286 family (all variants)"
      must: ["SRTWC286"]
  - text: "any eta mou?"
    expect:
      kind: any
      about: "ETA / incoming for the held SRTWC286 family ('mou' is the particle 'or not', never a product); a question back is acceptable only if it keeps the ETA ask and offers real SRTWC286 options"
      must_not: ['Which "mou"', 'Couldn''t find: "mou"']
  - text: "1"
    expect:
      kind: any
      about: "continues the ETA ask: incoming for the picked or listed SRTWC286 member(s); never the stock answer again and never an escalation hand-over"
      must_not: ["Stock details found", "Stock summary for", "Routed to your PIC"]
  - text: "hmm ih tough i ask for eta"
    expect:
      kind: answer
      about: "ETA answered directly for the SRTWC286 members that have incoming (the -NEW variants); no which-of-10 menu with has/no incoming stamps"
      must: ["SRTWC286"]
      must_not: ["Which product do you mean? Please choose", "Sorry, I didn't catch your choice"]
  - text: "semua laa"
    expect:
      kind: any
      about: "'semua' = all: incoming for every SRTWC286 member (a Malay reply is fine), or the same all-members ETA again; never read as Yes to an escalation or purchasing offer"
      must_not: ["Routed to your PIC", "Telah diserahkan"]
      allow_repeat: true

