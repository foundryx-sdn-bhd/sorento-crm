# PV2 battery: promotions / offers (UAC-1).
# Dev data (14 Oct): SRTKS7061 has dealer, end-user and office flyers (UPDATED SORENTO PROMO KITCHEN SINK_09092026);
# SRTWC286-SH has an office-only flyer (UPDATED SORENTO WATER CLOSET PROMO_27082026); SRTKS6042-BL has dealer /
# office / end-user honeycomb kitchen sink flyers; CGB1032B has no promotion. The SRTWC286 FAMILY ask finds only
# EXPIRED dealer flyers (UPDATED SORENTO A3 FLYER 2026 (DEALER)_21072026, SORENTO A3 FLYER_DEALER USE_11062026,
# JULY SORENTO WATER CLOSET PROMO_06072026 DEALER). Owner rulings 9 Oct (promo-subject-filter-acceptance-criteria.md
# Round 3, AC-33), read per promotion type by the 15 Oct ruling below.
# Owner ruling 15 Oct: an expired promotion row is still served per promotion type, marked EXPIRED, next to live rows
# of other types (app/api/v1/marketing/promotions.py serving_policy: a type with no live row contributes its latest expired
# row). Never fail an EXPIRED-marked flyer of another type.
# Promotion replies list the flyer files with dates and never echo the product code, so no `must` on codes.
domain: promotions
conversations:

- id: promotions-r01
  source: real
  origin: "crew/state/eval/dev/cand-0262.json (message; T2-T3 added)"
  domain: promotions
  audience: staff
  shapes: [reply_to_question, free_text_reply, refine]
  turns:
  - text: "promo srtks7061"
    expect:
      kind: any
      about: "active promotion for SRTKS7061: asks which copy (office / dealer / end user) or sends it; an expired flyer of a promotion type with no live row is served marked EXPIRED, beside live rows of other types (owner ruling 15 Oct)"
      judge: "Promotion replies list the flyer files with dates, not the product code. Owner ruling 15 Oct: an expired promotion row is still served per promotion type, marked EXPIRED, next to live rows of other types (promotions.py serving_policy: a type with no live row contributes its latest expired row). Never fail an EXPIRED-marked flyer of another type."
  - text: "dealer"
    expect:
      kind: answer
      about: "the dealer copy of the SRTKS7061 promotion is sent"
      attachments: true
      must_not: ["Sorry, I didn't catch your choice"]
  - text: "end user also"
    expect:
      kind: answer
      about: "the end-user copy of the same SRTKS7061 promotion is sent"
      attachments: true

- id: promotions-r02
  source: real
  origin: "crew/state/eval/dev/cand-0274.json (history + message; T3 added)"
  domain: promotions
  audience: dealer
  shapes: [small_talk, refine]
  turns:
  - text: "Hi"
    expect:
      kind: answer
      about: "a short greeting back, no lookup"
  - text: "Srtwc286 offer"
    expect:
      kind: answer
      about: "dealer promotions for the SRTWC286 family: no live dealer promotion exists, so the EXPIRED dealer flyers marked EXPIRED (owner rulings 9 Oct, AC-33) or a plain no-current-promotion line; never the office-only SRTWC286-SH flyer"
      must_not: ["PROMO_27082026", "OFFICE.pdf", "(OFFICE", "OFFICE USE"]
  - text: "any promo for kitchen sink then?"
    expect:
      kind: any
      about: "dealer kitchen sink promotions currently active (dealer copies only), or a which-one question over them"
      must_not: ["OFFICE.pdf", "(OFFICE", "OFFICE USE"]

- id: promotions-r03
  source: real
  origin: "crew/state/eval/dev/cand-0265.json (message; T2-T3 added)"
  domain: promotions
  audience: staff
  shapes: [topic_switch, reply_to_question]
  turns:
  - text: "CGB1032B promotion"
    expect:
      kind: answer
      about: "no promotion is linked to CGB1032B: said directly (not a tier question that lists 'no promotion' per tier)"
      must: ["CGB1032B"]
      attachments: false
  - text: "ok how about SRTKS6042-BL"
    expect:
      kind: any
      about: "active promotions for SRTKS6042-BL (honeycomb kitchen sink flyers): which copy, or sends them"
      judge: "Promotion replies list the flyer files with dates, not the product code."
  - text: "office use copy"
    expect:
      kind: answer
      about: "the office copy of the SRTKS6042-BL promotion is sent"
      attachments: true

- id: promotions-i01
  source: improvised
  domain: promotions
  audience: dealer
  shapes: [particle, refine, multi_product]
  turns:
  - text: "SRTKS7061 got promo mou?"
    expect:
      kind: any
      about: "the dealer promotion for SRTKS7061 ('mou' = or not): sends the dealer copy or says it exists and offers it"
      must: ["SRTKS7061"]
      must_not: ['Which "mou"']
  - text: "send me the flyer lah"
    expect:
      kind: answer
      about: "the dealer flyer of the SRTKS7061 promotion is sent (or sent again)"
      attachments: true
      allow_repeat: true
  - text: "SRTKS6042-BL also"
    expect:
      kind: answer
      about: "the dealer promotion flyer(s) covering SRTKS6042-BL are sent; an expired flyer of a promotion type with no live row is served marked EXPIRED, beside live rows of other types (owner ruling 15 Oct)"
      attachments: true
      must_not: ["OFFICE.pdf", "(OFFICE"]
      judge: "Owner ruling 15 Oct: an expired promotion row is still served per promotion type, marked EXPIRED, next to live rows of other types (promotions.py serving_policy: a type with no live row contributes its latest expired row). Never fail an EXPIRED-marked flyer of another type."

- id: promotions-i02
  source: improvised
  domain: promotions
  audience: dealer_nogrant
  shapes: [permission, unclear, free_text_reply]
  turns:
  - text: "any promotion?"
    expect:
      kind: refuse
      about: "this contact holds no access type, so promotions are refused with the no-access line; no file dump"
      must: ["You have no access levels configured to get promotions."]
      attachments: false
  - text: "kitchen sink"
    expect:
      kind: any
      about: "still no promotions for this account: the same no-access line or that none is available; never office-only files and never a master-product lookup"
      must_not: ["OFFICE.pdf", "(OFFICE", "OFFICE USE"]

- id: promotions-i03
  source: improvised
  domain: promotions
  audience: unlinked
  shapes: [language_mix, reply_to_question, small_talk]
  turns:
  - text: "SRTKS7061 有什么offer?"
    expect:
      kind: any
      about: "the SRTKS7061 promotion this contact may see (dealer or end-user copy) sent, or a which-copy question, Chinese reply"
      must: ["SRTKS7061"]
  - text: "dealer copy"
    expect:
      kind: answer
      about: "the dealer copy of the SRTKS7061 promotion is sent"
      attachments: true
      allow_repeat: true
  - text: "谢谢"
    expect:
      kind: answer
      about: "a short thank-you reply in Chinese, no lookup"
      lang: zh

